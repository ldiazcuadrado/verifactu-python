[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "verifactu-sdk"
version = "0.1.0"
description = "Librería Python para VERI*FACTU (AEAT): huella SHA-256 encadenada, XML validado contra el XSD oficial, código QR y envío SOAP a la Agencia Tributaria."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ldiazcuadrado" }]
keywords = [
  "verifactu", "veri*factu", "aeat", "agencia tributaria", "facturacion", "factura",
  "invoice", "e-invoicing", "spain", "españa", "sif", "huella", "hash", "qr",
  "ley antifraude", "crea y crece", "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Natural Language :: Spanish",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "lxml>=5.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
qr = ["segno>=1.6"]
pkcs12 = ["cryptography>=42"]
mcp = ["mcp>=1.2", "segno>=1.6"]
all = ["segno>=1.6", "cryptography>=42", "mcp>=1.2"]

[project.scripts]
verifactu = "verifactu_sdk.cli:main"
verifactu-sdk-mcp = "verifactu_sdk.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ldiazcuadrado/verifactu-python"
Documentation = "https://github.com/ldiazcuadrado/verifactu-python#readme"
Repository = "https://github.com/ldiazcuadrado/verifactu-python"
Issues = "https://github.com/ldiazcuadrado/verifactu-python/issues"
Changelog = "https://github.com/ldiazcuadrado/verifactu-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "segno>=1.6", "cryptography>=42", "mcp>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/verifactu_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # las URL oficiales de la AEAT no caben en 100 columnas

[tool.pytest.ini_options]
testpaths = ["tests"]
